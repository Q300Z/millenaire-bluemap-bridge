name: Publication de Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'update.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Création de Release & Montée de Version
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Montée de version automatique & tag SemVer
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main

      - name: Mise à jour automatique de update.json (NeoForge Update Checker)
        if: steps.tag_version.outputs.new_tag != ''
        run: |
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          echo "Mise à jour de update.json vers la version ${VERSION}..."
          
          python3 -c "
          import json
          with open('update.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          if 'promos' not in data:
              data['promos'] = {}
          data['promos']['26.3-latest'] = '${VERSION}'
          data['promos']['26.3-recommended'] = '${VERSION}'
          
          if '26.3' not in data:
              data['26.3'] = {}
          data['26.3']['${VERSION}'] = 'Mise à jour vers la version ${VERSION} pour Minecraft 26.3.'
          
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "
          
          git config user.name "Q300Z"
          git config user.email "Q300Zhomas@gmail.com"
          git add update.json
          git commit -s -m "chore(release): mise à jour automatique de update.json vers v${VERSION} [skip ci]" || echo "Aucun changement dans update.json"
          git push origin main || echo "Push skipped or branch already up to date"

      - name: Préparation et empaquetage des artefacts de release
        if: steps.tag_version.outputs.new_tag != ''
        run: |
          mkdir -p dist
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          
          echo "Préparation de la version ${VERSION} (${TAG})..."
          
          # 1. Empaquetage des assets Web BlueMap
          zip -j dist/millenaire-bluemap-web-assets-${VERSION}.zip web/js/millenaire_panel.js web/css/millenaire_panel.css
          cp web/js/millenaire_panel.js dist/millenaire_panel.js
          cp web/css/millenaire_panel.css dist/millenaire_panel.css
          cp update.json dist/update.json
          
          # 2. Empaquetage du binaire du mod jar
          if [ -f "mods/millenaire-bluemap-bridge-1.0.0.jar" ]; then
            cp "mods/millenaire-bluemap-bridge-1.0.0.jar" "dist/millenaire-bluemap-bridge-${VERSION}.jar"
          elif [ -f "millenaire-bluemap-bridge-1.0.0.jar" ]; then
            cp "millenaire-bluemap-bridge-1.0.0.jar" "dist/millenaire-bluemap-bridge-${VERSION}.jar"
          elif [ -f "libs/millenaire-bluemap-bridge-1.0.0.jar" ]; then
            cp "libs/millenaire-bluemap-bridge-1.0.0.jar" "dist/millenaire-bluemap-bridge-${VERSION}.jar"
          fi
          
          if [ ! -f "dist/millenaire-bluemap-bridge-${VERSION}.jar" ]; then
            echo "::error::Échec critique : Aucun fichier JAR du mod trouvé pour la release !"
            exit 1
          fi
          
          echo "Artefacts prêts pour la release :"
          ls -la dist/

      - name: Publication de la GitHub Release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
